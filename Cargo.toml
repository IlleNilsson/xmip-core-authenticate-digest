[package]
name = "xmip-core-authenticate-digest"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-authenticate-digest"
description = "Authenticate by HTTP Digest: verifies an RFC 7616 response against the stored HA1 for the realm and a nonce this node issued. A xmip-core-authenticate technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md), and on no sibling (ADR-0050 section 6). The
# mechanism catalog is xmip-core's and the verdict is xmip-core-context's.
authenticate = { workspace = true }
# identify for the Authorization header, read once for both gates.
identify = { workspace = true }
xcore = { workspace = true }
context = { workspace = true }
# RFC 7616 names MD5 beside SHA-256, and clients still send it. Pure Rust:
# RustCrypto's, as the SHA-256 beside it (`sha2`) and NTLM's MD5 are.
md-5 = "0.11"
# The estate's encoding primitives: hex, which Digest writes every hash in.
codec = { workspace = true }

[lints]
workspace = true
